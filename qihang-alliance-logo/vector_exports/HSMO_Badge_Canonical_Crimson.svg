<svg viewBox="0 0 600 600" width="1200" height="1200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Top Arc Path: Clockwise upper track for English text (R=238, arc length ~731px, perfectly fits 51 chars with NO truncation) -->
    <path id="topArcPath" d="M 62 285 A 238 238 0 0 1 538 285" fill="none"/>
    <!-- Bottom Arc Path: Upright smile track for Chinese formal logotype (R=232, span ~140 deg, fits 11 chars harmoniously) -->
    <path id="botArcPath" d="M 72 345 A 232 232 0 0 0 528 345" fill="none"/>
  </defs>

  <!-- Outermost stroke ring (外同心包边圆环) -->
  <circle cx="300" cy="300" r="285" fill="#ffffff" stroke="#9B2034" stroke-width="12"/>
  
  <!-- Inner circular solid disc (核心色盘) -->
  <circle cx="300" cy="300" r="174" fill="#9B2034" stroke="#9B2034" stroke-width="1"/>

  <!-- Top arc text: English full institutional title (100% complete, never truncated) -->
  <text fill="#9B2034" font-family="'Space Grotesk', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16.2" font-weight="700" letter-spacing="1.5">
    <textPath href="#topArcPath" startOffset="50%" text-anchor="middle">
      HIGH SCHOOL MATHEMATICAL OLYMPIAD · QIHANG ALLIANCE
    </textPath>
  </text>

  <!-- Bottom arc text: Chinese formal title (底部规范中文标准字，正立易读) -->
  <text fill="#9B2034" font-family="'Noto Serif SC', 'Songti SC', 'Source Han Serif SC', 'STSong', serif" font-size="28" font-weight="900" letter-spacing="4.6">
    <textPath href="#botArcPath" startOffset="50%" text-anchor="middle">
      高中数学奥林匹克启航联盟
    </textPath>
  </text>
  
  <!-- Central motif: pure white Mobius Sail silhouette (中央纯白拓扑之帆母标图腾) -->
  <g transform="translate(133, 146.5) scale(1.55)" fill="#ffffff">
    <!-- Base wave / hull -->
    <path d="M 30 162 C 55 142 80 182 105 162 C 130 142 155 178 178 152 C 158 172 125 180 102 166 C 82 152 50 178 30 162 Z"/>
    <!-- Small secondary sail -->
    <path d="M 108 153 C 119 133 133 97 147 78 C 140 106 131 134 125 152 C 119 153 113 153 108 153 Z"/>
    <!-- Grand main topological sail -->
    <path d="M 52 148 C 65 110 92 60 138 28 C 122 68 110 115 102 156 C 84 156 68 152 52 148 Z"/>
    <!-- Singularity Star at apex -->
    <circle cx="138" cy="28" r="4.6"/>
  </g>
</svg>
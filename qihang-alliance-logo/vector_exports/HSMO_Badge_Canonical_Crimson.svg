<svg viewBox="0 0 600 600" width="1200" height="1200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Top Arc Path: Clockwise upper track for English text (R=236, arc length ~718px, fits 51 chars with NO truncation) -->
    <path id="topHarmonic" d="M 66 278 A 236 236 0 0 1 534 278" fill="none"/>
    <!-- Bottom Arc Path: Upright smile track for Chinese formal logotype (R=230, balanced and spacious) -->
    <path id="botHarmonic" d="M 80 348 A 230 230 0 0 0 520 348" fill="none"/>
  </defs>

  <!-- 1. Outermost stroke ring (外同心包边圆环) -->
  <circle cx="300" cy="300" r="286" fill="#ffffff" stroke="#9B2034" stroke-width="10"/>

  <!-- 2. Concentric inner precision ring (华东师大校徽精髓：内嵌同心细圈) -->
  <circle cx="300" cy="300" r="186" fill="none" stroke="#9B2034" stroke-width="2.5"/>

  <!-- 3. Inner circular solid disc (核心实体色盘) -->
  <circle cx="300" cy="300" r="176" fill="#9B2034"/>

  <!-- 4. Top arc text: English full institutional title (加粗有力无衬线，字号16.5px，100%完整无截断) -->
  <text fill="#9B2034" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Space Grotesk', sans-serif" font-size="16.5" font-weight="800" letter-spacing="1.4">
    <textPath href="#topHarmonic" startOffset="50%" text-anchor="middle">
      HIGH SCHOOL MATHEMATICAL OLYMPIAD · QIHANG ALLIANCE
    </textPath>
  </text>

  <!-- 5. Bottom arc text: Chinese formal title (规范中文标准字，字号24px，字距5.2，与英文视觉重量黄金对等) -->
  <text fill="#9B2034" font-family="'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', 'STSong', serif" font-size="24" font-weight="900" letter-spacing="5.2">
    <textPath href="#botHarmonic" startOffset="50%" text-anchor="middle">
      高中数学奥林匹克启航联盟
    </textPath>
  </text>
  
  <!-- 6. Central motif: pure white Mobius Sail silhouette (放大至1.76倍，充满张力，绝不空旷) -->
  <g transform="translate(112, 126) scale(1.76)" fill="#ffffff">
    <!-- Base wave / hull -->
    <path d="M 30 162 C 55 142 80 182 105 162 C 130 142 155 178 178 152 C 158 172 125 180 102 166 C 82 152 50 178 30 162 Z"/>
    <!-- Small secondary sail -->
    <path d="M 108 153 C 119 133 133 97 147 78 C 140 106 131 134 125 152 C 119 153 113 153 108 153 Z"/>
    <!-- Grand main topological sail -->
    <path d="M 52 148 C 65 110 92 60 138 28 C 122 68 110 115 102 156 C 84 156 68 152 52 148 Z"/>
    <!-- Singularity Star at apex -->
    <circle cx="138" cy="28" r="4.6"/>
  </g>
</svg>
<svg viewBox="0 0 400 400" width="800" height="800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="sealInkBleed" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <!-- 带有微弱印泥渗色与自然质感的朱砂红图层 -->
  <g fill="#C92A2A" stroke="#C92A2A" filter="url(#sealInkBleed)">
    <!-- 外圈实线圆环 (国际标准 1.2mm 比例) -->
    <circle cx="200" cy="200" r="186" fill="none" stroke-width="7"/>
    <circle cx="200" cy="200" r="176" fill="none" stroke-width="1.5"/>

    <!-- 环形文字路径：高中数学奥林匹克启航联盟组织委员会 -->
    <path id="sealTextPath" d="M 40 200 A 160 160 0 1 1 360 200" fill="none"/>
    <text font-family="'Noto Serif SC', 'Songti SC', 'STSong', serif" font-size="23.5" font-weight="900" letter-spacing="3.5">
      <textPath href="#sealTextPath" startOffset="50%" text-anchor="middle">
        高中数学奥林匹克启航联盟组织委员会
      </textPath>
    </text>

    <!-- 中心五角星与莫比乌斯星芒图形 -->
    <g transform="translate(130, 130) scale(0.7)">
      <polygon points="100,20 123,80 188,80 135,120 155,180 100,140 45,180 65,120 12,80 77,80" fill="#C92A2A"/>
    </g>

    <!-- 底部横向防伪字样 -->
    <text x="200" y="325" text-anchor="middle" font-family="'Space Grotesk', 'Noto Serif SC', sans-serif" font-size="14" font-weight="700" letter-spacing="3">
      ★ 专用电子印鉴 ★
    </text>
    <text x="200" y="348" text-anchor="middle" font-family="'Space Grotesk', monospace" font-size="10.5" font-weight="600" letter-spacing="2">
      NO. 2026-HSMO-8848
    </text>
  </g>
</svg>
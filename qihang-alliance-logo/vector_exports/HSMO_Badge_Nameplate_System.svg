<svg viewBox="0 0 1000 680" width="1000" height="680" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="goldRim" x1="0" y1="0" x2="480" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="30%" stop-color="#FDE047"/>
      <stop offset="70%" stop-color="#FEF08A"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
    <linearGradient id="silverRim" x1="0" y1="0" x2="480" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#64748B"/>
      <stop offset="30%" stop-color="#E2E8F0"/>
      <stop offset="70%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="cyanRim" x1="0" y1="0" x2="480" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0891B2"/>
      <stop offset="50%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#0E7490"/>
    </linearGradient>
    <linearGradient id="cardDarkPurp" x1="0" y1="0" x2="450" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#28114C"/>
      <stop offset="100%" stop-color="#120824"/>
    </linearGradient>
    <linearGradient id="cardDarkBlue" x1="0" y1="0" x2="450" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>

  <!-- 1. 专家胸牌 EXPERT -->
  <g transform="translate(20, 20)">
    <rect x="0" y="0" width="460" height="140" rx="70" fill="url(#goldRim)"/>
    <rect x="8" y="8" width="444" height="124" rx="62" fill="url(#cardDarkPurp)" stroke="url(#goldRim)" stroke-width="1.5"/>
    <text x="145" y="58" font-family="'Noto Serif SC', serif" font-size="20" font-weight="900" fill="#FEF08A" letter-spacing="2">高中数学奥林匹克启航联盟</text>
    <text x="146" y="80" font-family="'Cinzel', sans-serif" font-size="7.5" font-weight="700" fill="#E2D8F7" letter-spacing="1">HSMO · QIHANG ALLIANCE</text>
    <rect x="146" y="90" width="130" height="22" rx="4" fill="rgba(245, 158, 11, 0.25)" stroke="#FDE047" stroke-width="1"/>
    <text x="211" y="105" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="800" fill="#FEF08A">★ EXPERT 命题专家组</text>
    <!-- 左侧金色小徽记 -->
    <circle cx="75" cy="70" r="42" fill="#2E1065" stroke="url(#goldRim)" stroke-width="2"/>
    <text x="75" y="78" text-anchor="middle" font-family="'Cinzel', serif" font-size="26" font-weight="900" fill="#FDE047">Σ</text>
  </g>

  <!-- 2. 教练胸牌 COACH -->
  <g transform="translate(520, 20)">
    <rect x="0" y="0" width="460" height="140" rx="70" fill="url(#goldRim)"/>
    <rect x="8" y="8" width="444" height="124" rx="62" fill="url(#cardDarkPurp)" stroke="url(#goldRim)" stroke-width="1.5"/>
    <text x="145" y="58" font-family="'Noto Serif SC', serif" font-size="20" font-weight="900" fill="#FEF08A" letter-spacing="2">高中数学奥林匹克启航联盟</text>
    <text x="146" y="80" font-family="'Cinzel', sans-serif" font-size="7.5" font-weight="700" fill="#E2D8F7" letter-spacing="1">HSMO · QIHANG ALLIANCE</text>
    <rect x="146" y="90" width="130" height="22" rx="4" fill="rgba(192, 132, 252, 0.25)" stroke="#C084FC" stroke-width="1"/>
    <text x="211" y="105" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="800" fill="#E879F9">★ COACH 金牌主教练</text>
    <circle cx="75" cy="70" r="42" fill="#2E1065" stroke="url(#goldRim)" stroke-width="2"/>
    <text x="75" y="78" text-anchor="middle" font-family="'Cinzel', serif" font-size="26" font-weight="900" fill="#FDE047">C</text>
  </g>

  <!-- 3. 工作人员胸牌 STAFF -->
  <g transform="translate(20, 180)">
    <rect x="0" y="0" width="460" height="140" rx="70" fill="url(#silverRim)"/>
    <rect x="8" y="8" width="444" height="124" rx="62" fill="url(#cardDarkBlue)" stroke="url(#silverRim)" stroke-width="1.5"/>
    <text x="145" y="58" font-family="'Noto Serif SC', serif" font-size="20" font-weight="900" fill="#F8FAFC" letter-spacing="2">高中数学奥林匹克启航联盟</text>
    <text x="146" y="80" font-family="'Cinzel', sans-serif" font-size="7.5" font-weight="700" fill="#94A3B8" letter-spacing="1">HSMO · QIHANG ALLIANCE</text>
    <rect x="146" y="90" width="130" height="22" rx="4" fill="rgba(148, 163, 184, 0.2)" stroke="#E2E8F0" stroke-width="1"/>
    <text x="211" y="105" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="800" fill="#FFFFFF">● STAFF 组委会执行组</text>
    <circle cx="75" cy="70" r="42" fill="#0F172A" stroke="url(#silverRim)" stroke-width="2"/>
    <text x="75" y="78" text-anchor="middle" font-family="'Cinzel', serif" font-size="26" font-weight="900" fill="#E2E8F0">S</text>
  </g>

  <!-- 4. 集训队员/学员胸牌 DELEGATE -->
  <g transform="translate(520, 180)">
    <rect x="0" y="0" width="460" height="140" rx="70" fill="url(#cyanRim)"/>
    <rect x="8" y="8" width="444" height="124" rx="62" fill="url(#cardDarkPurp)" stroke="url(#cyanRim)" stroke-width="1.5"/>
    <text x="145" y="58" font-family="'Noto Serif SC', serif" font-size="20" font-weight="900" fill="#67E8F9" letter-spacing="2">高中数学奥林匹克启航联盟</text>
    <text x="146" y="80" font-family="'Cinzel', sans-serif" font-size="7.5" font-weight="700" fill="#A5F3FC" letter-spacing="1">HSMO · QIHANG ALLIANCE</text>
    <rect x="146" y="90" width="130" height="22" rx="4" fill="rgba(6, 182, 212, 0.2)" stroke="#22D3EE" stroke-width="1"/>
    <text x="211" y="105" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="800" fill="#22D3EE">▲ DELEGATE 集训队员</text>
    <circle cx="75" cy="70" r="42" fill="#1E0E3E" stroke="url(#cyanRim)" stroke-width="2"/>
    <text x="75" y="78" text-anchor="middle" font-family="'Cinzel', serif" font-size="26" font-weight="900" fill="#22D3EE">D</text>
  </g>
</svg>
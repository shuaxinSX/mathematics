  <!-- 左侧图形标志 (莫比乌斯母标) -->
  <g transform="translate(20, 10)">
    <path d="M 30 162 C 55 142 80 182 105 162 C 130 142 155 178 178 152 C 158 172 125 180 102 166 C 82 152 50 178 30 162 Z" fill="url(#hHull)"/>
    <path d="M 106 156 C 118 135 132 95 148 76 C 140 105 130 135 124 154 Z" fill="url(#hSail2)"/>
    <path d="M 52 150 C 65 110 92 60 138 28 C 122 68 110 115 102 158 Z" fill="url(#hSail1)"/>
    <circle cx="138" cy="28" r="8" fill="url(#hStar)"/>
    <circle cx="138" cy="28" r="2.2" fill="#FFFFFF"/>
  </g>

  <!-- 中间分割微细黄金竖线 -->
  <line x1="220" y1="40" x2="220" y2="180" stroke="rgba(245, 158, 11, 0.4)" stroke-width="1.5"/>

  <!-- 右侧中英文排版 (上行中文，下行英文) -->

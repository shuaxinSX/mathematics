<svg viewBox="0 0 480 160" width="960" height="320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="metalRim" x1="0" y1="0" x2="480" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="25%" stop-color="#FBBF24"/>
      <stop offset="50%" stop-color="#FEF08A"/>
      <stop offset="75%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="innerPurple" x1="20" y1="20" x2="460" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#28114C"/>
      <stop offset="100%" stop-color="#140A28"/>
    </linearGradient>
    <linearGradient id="goldText" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="40%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>
  
  <!-- 金属胸牌外底板 (拉丝倒角金边) -->
  <rect x="6" y="16" width="468" height="136" rx="68" fill="url(#metalRim)" stroke="#78350F" stroke-width="1.5"/>
  
  <!-- 内部哑光深紫珐琅槽 -->
  <rect x="16" y="26" width="448" height="116" rx="58" fill="url(#innerPurple)" stroke="url(#metalRim)" stroke-width="2"/>
  
  <!-- 破框 3D 莫比乌斯帆船标志 (稍微突破上边框) -->
  <g transform="translate(18, 0) scale(0.85)">
    <path d="M 30 162 C 55 142 80 182 105 162 C 130 142 155 178 178 152 C 158 172 125 180 102 166 C 82 152 50 178 30 162 Z" 
          fill="#3B1261" stroke="url(#metalRim)" stroke-width="3"/>
    <path d="M 106 156 C 118 135 132 95 148 76 C 140 105 130 135 124 154 C 117 156 111 156 106 156 Z" 
          fill="#4C1D95" stroke="url(#metalRim)" stroke-width="2.5"/>
    <path d="M 52 150 C 65 110 92 60 138 28 C 122 68 110 115 102 158 C 84 158 68 154 52 150 Z" 
          fill="#581C87" stroke="url(#metalRim)" stroke-width="3"/>
    <circle cx="138" cy="28" r="4.5" fill="url(#metalRim)"/>
  </g>
  
  <!-- 中文官方名称 (立体微凸烫金) -->
  <text x="175" y="70" font-family="'Noto Serif SC', 'Songti SC', serif" font-size="23" font-weight="900" fill="url(#goldText)" letter-spacing="2">
    高中数学奥林匹克启航联盟
  </text>
  
  <!-- 英文法定名称 -->
  <text x="176" y="94" font-family="'Space Grotesk', 'Cinzel', sans-serif" font-size="9" font-weight="700" fill="#E2D8F7" letter-spacing="1.2">
    HIGH SCHOOL MATHEMATICAL OLYMPIAD · QIHANG ALLIANCE
  </text>
  
  <!-- 底部身份卡槽 (微凸金牌) -->
  <rect x="176" y="106" width="138" height="20" rx="4" fill="rgba(245, 158, 11, 0.2)" stroke="url(#metalRim)" stroke-width="1"/>
  <text x="245" y="120" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="9.5" font-weight="800" fill="#FEF08A" letter-spacing="1">
    ★ EXPERT 命题专家组
  </text>
</svg>

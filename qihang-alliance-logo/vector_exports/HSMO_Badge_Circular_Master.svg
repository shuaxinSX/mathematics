<svg viewBox="0 0 500 500" width="1000" height="1000" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="badgeGoldRing" x1="0" y1="0" x2="500" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="25%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#FEF08A"/>
      <stop offset="75%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
    <linearGradient id="badgeDarkPurple" x1="50" y1="50" x2="450" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E0E3E"/>
      <stop offset="50%" stop-color="#2E1065"/>
      <stop offset="100%" stop-color="#0F0521"/>
    </linearGradient>
    <linearGradient id="badgeSail1" x1="120" y1="390" x2="380" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4C1D95"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <linearGradient id="badgeSail2" x1="280" y1="360" x2="400" y2="130" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6D28D9"/>
      <stop offset="60%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#E879F9"/>
    </linearGradient>
    <linearGradient id="badgeHull" x1="100" y1="390" x2="410" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="40%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#D946EF"/>
    </linearGradient>
    <radialGradient id="badgeStarGlow" cx="345" cy="120" r="22" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#FDE047"/>
      <stop offset="80%" stop-color="#F59E0B" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <path id="badgeTopPath" d="M 73.3 167.6 A 195 195 0 0 1 426.7 167.6" fill="none"/>
    <path id="badgeBotPath" d="M 62.4 337.5 A 207 207 0 0 0 437.6 337.5" fill="none"/>
  </defs>

  <!-- 外层金色拉丝包边与微凸外环 -->
  <circle cx="250" cy="250" r="242" fill="url(#badgeGoldRing)"/>
  <circle cx="250" cy="250" r="236" fill="#14062B" stroke="#92400E" stroke-width="2"/>
  
  <!-- 外圈深紫文字环轨道 -->
  <circle cx="250" cy="250" r="230" fill="url(#badgeDarkPurple)"/>
  <circle cx="250" cy="250" r="172" fill="#14062B" stroke="url(#badgeGoldRing)" stroke-width="2.5"/>
  <circle cx="250" cy="250" r="166" stroke="rgba(253, 224, 71, 0.4)" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- 顶部英文文字 (顺时针，自然正立) -->
  <text fill="url(#badgeGoldRing)" font-family="'Cinzel', 'Space Grotesk', serif" font-size="14" font-weight="900" letter-spacing="3.8">
    <textPath href="#badgeTopPath" startOffset="50%" text-anchor="middle">
      HIGH SCHOOL MATHEMATICAL OLYMPIAD
    </textPath>
  </text>

  <!-- 底部中文与常数 (逆时针左向右，100% 正立，绝不倒置) -->
  <text fill="#FEF08A" font-family="'Noto Serif SC', 'Songti SC', serif" font-size="14.5" font-weight="700" letter-spacing="4.5">
    <textPath href="#badgeBotPath" startOffset="50%" text-anchor="middle">
      ★ 启航联盟 · π · e · i · φ ★
    </textPath>
  </text>

  <!-- 左右侧黄金分界星点 -->
  <circle cx="48" cy="250" r="3.5" fill="#FDE047" opacity="0.75"/>
  <circle cx="452" cy="250" r="3.5" fill="#FDE047" opacity="0.75"/>

  <!-- 内部中心盘: 极细几何同心星轨与坐标线 -->
  <g opacity="0.18" stroke="#FDE047" stroke-width="0.8">
    <circle cx="250" cy="250" r="132" fill="none" stroke-dasharray="3 3"/>
    <circle cx="250" cy="250" r="92" fill="none"/>
  </g>

  <!-- 中央纯净莫比乌斯之帆母标 -->
  <g transform="translate(100, 100) scale(1.5)">
    <path d="M 30 162 C 55 142 80 182 105 162 C 130 142 155 178 178 152 C 158 172 125 180 102 166 C 82 152 50 178 30 162 Z" fill="url(#badgeHull)" opacity="0.95"/>
    <path d="M 106 156 C 118 135 132 95 148 76 C 140 105 130 135 124 154 Z" fill="url(#badgeSail2)" opacity="0.9"/>
    <path d="M 52 150 C 65 110 92 60 138 28 C 122 68 110 115 102 158 Z" fill="url(#badgeSail1)"/>
    <circle cx="138" cy="28" r="14" fill="url(#badgeStarGlow)"/>
    <circle cx="138" cy="28" r="3.5" fill="#FFFFFF"/>
  </g>
</svg>
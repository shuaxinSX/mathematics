  </text>
  
  <text x="238" y="128" font-family="'Noto Serif SC', 'Songti SC', serif" font-size="44" font-weight="900" fill="url(#offGoldText)" letter-spacing="4">
    中国高中数学奥林匹克竞赛启航联盟
  </text>

  <text x="240" y="162" font-family="'Cinzel', 'Space Grotesk', sans-serif" font-size="12" font-weight="700" fill="#E2E8F0" letter-spacing="2">

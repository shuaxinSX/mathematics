<svg viewBox="0 0 400 400" width="800" height="800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 上弧法定名称轨道：半圆上方饱满分布，起点终点严谨对称，杜绝垂直拉伸与下垂变形 -->
    <path id="sealArcPathOfficial" d="M 64.0 215.0 A 136 136 0 1 1 336.0 215.0" fill="none"/>
    <!-- 下弧防伪准考/防伪校验码微弧轨道 -->
    <path id="sealCodeArcOfficial" d="M 120 316 A 150 150 0 0 0 280 316" fill="none"/>
  </defs>

  <!-- 中华人民共和国社会组织/学术联盟标准 42mm 圆形印鉴规制 -->
  <g fill="#C92A2A" stroke="#C92A2A">
    <!-- 外圈实线圆环 (标准 4.8px 规范外圈) -->
    <circle cx="200" cy="200" r="186" fill="none" stroke-width="4.8"/>

    <!-- 环形上部法定全称：高中数学奥林匹克启航联盟组织委员会 -->
    <!-- 显式加强笔画饱满度与抗锯齿，防止特定字库下宋体横笔过细产生的拉长假象 -->
    <text fill="#C92A2A" stroke="#C92A2A" stroke-width="0.75" font-family="'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', 'STSong', 'SimSun', serif" font-size="21.5" font-weight="900" letter-spacing="1.2">
      <textPath href="#sealArcPathOfficial" startOffset="50%" text-anchor="middle">
        高中数学奥林匹克启航联盟组织委员会
      </textPath>
    </text>

    <!-- 中心正五角星 (严格水平居中对称，五角尖顶向上) -->
    <polygon points="200.00,150.00 212.35,188.00 252.31,188.00 219.98,211.48 232.33,249.48 200.00,226.00 167.67,249.48 180.02,211.48 147.69,188.00 187.65,188.00" fill="#C92A2A" stroke="none"/>

    <!-- 底部国标 13 位微缩防伪数字印鉴编码 (严谨、规范、合规) -->
    <text fill="#C92A2A" stroke="none" font-family="'Space Grotesk', 'Courier New', monospace" font-size="11.5" font-weight="700" letter-spacing="3.5">
      <textPath href="#sealCodeArcOfficial" startOffset="50%" text-anchor="middle">
        1101082026884
      </textPath>
    </text>
  </g>
</svg>